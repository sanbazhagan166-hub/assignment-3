<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Police Department Demo</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        background: #0d0d35;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        color: white;
    }

    .container {
        text-align: center;
    }

    .logo {
        width: 150px;
        max-width: 80%;
        margin-bottom: 20px;
    }

    h2 {
        font-size: 18px;
        letter-spacing: 1px;
    }

    .notice {
        font-size: 12px;
        opacity: 0.7;
        margin-top: 25px;
    }
</style>
</head>

<body>

<div class="container">

    <!-- Rename your uploaded image to logo.png -->
    <img src="logo.png"
         alt="Police Department Logo"
         class="logo">

    <h2>PROUD TO PROTECT & SERVE YOU</h2>

    <p class="notice">
        DEMONSTRATION WEBSITE — NOT AN OFFICIAL POLICE PORTAL
    </p>

</div>

</body>
</html>
